services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COMPANY_LICENSE_DIRECTORY: /app/company-licenses
    volumes:
      - company_licenses:/app/company-licenses
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/auth/csrf"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:18.6
    container_name: trekking-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./schema/migrations/001_add_google_subject.sql:/docker-entrypoint-initdb.d/02_google_auth.sql:ro
      - ./schema/migrations/002_add_account_session_version.sql:/docker-entrypoint-initdb.d/03_account_session_version.sql:ro
      - ./schema/migrations/003_add_cooperation_policy_terms.sql:/docker-entrypoint-initdb.d/04_cooperation_policy_terms.sql:ro
      - ./schema/migrations/004_add_financial_permissions.sql:/docker-entrypoint-initdb.d/05_financial_permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  company_licenses:
  redis_data:
  postgres_data:
    driver: local
