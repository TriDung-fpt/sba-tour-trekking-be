
name: Test VPS SSH

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH and verify host
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "SSH TEST VERSION 3"

          test -n "$SSH_KEY" || { echo "Missing VPS_SSH_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS"; exit 1; }
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Known hosts fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

          echo "Checking host entry:"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" \
            >/dev/null || {
              echo "Host entry not found in known_hosts"
              exit 1
            }

          echo "Host entry found."

          echo "Testing SSH..."
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${VPS_USER}@${VPS_HOST}" \
            "whoami && hostname && docker ps"
