spring.application.name=treeking
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Values injected from Environment Variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trekking_db}?currentSchema=trekking
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.default_schema=trekking
# Schema is owned by schema/schema.sql and schema/migrations; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.jwt-secret=${JWT_SECRET:}
app.auth.otp-secret=${OTP_SECRET:}
app.auth.issuer=trekking-api
app.auth.audience=trekking-client
app.auth.access-ttl=15m
app.auth.session-ttl=7d
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:}
app.auth.mail-from=${MAIL_FROM:${MAIL_USERNAME:}}
app.auth.redis-prefix=${AUTH_REDIS_PREFIX:trekking:auth:}
app.auth.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.payment.payos.client-id=${PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${PAYOS_API_KEY:}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payment.payos.payout-client-id=${PAYOS_PAYOUT_CLIENT_ID:}
app.payment.payos.payout-api-key=${PAYOS_PAYOUT_API_KEY:}
app.payment.payos.payout-checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY:}
# Booking code prefix for tours without an admin-managed tour code (e.g. BK-K7PQ2M9XRA).
app.booking.code-prefix=${BOOKING_CODE_PREFIX:BK}
# Base64 of 32 random bytes (openssl rand -base64 32); encrypts refund bank details at rest.
app.payment.refund-encryption-key=${REFUND_DATA_ENCRYPTION_KEY:}
app.payment.payos.return-url=${PAYOS_RETURN_URL:}
app.payment.payos.cancel-url=${PAYOS_CANCEL_URL:}
app.payment.payos.api-base-url=${PAYOS_API_BASE_URL:https://api-merchant.payos.vn}
springdoc.swagger-ui.csrf.enabled=true
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Local AI / RAG (LM Studio OpenAI-compatible API)
spring.ai.openai.base-url=${AI_BASE_URL:http://localhost:1234/v1}
spring.ai.openai.api-key=${AI_API_KEY:lm-studio}
spring.ai.openai.chat.options.model=${AI_CHAT_MODEL:qwen2.5-7b-instruct-1m}
spring.ai.openai.chat.options.temperature=${AI_CHAT_TEMPERATURE:0.3}
spring.ai.openai.embedding.options.model=${AI_EMBEDDING_MODEL:text-embedding-nomic-embed-text-v1.5}
spring.ai.vectorstore.pgvector.schema-name=trekking
spring.ai.vectorstore.pgvector.table-name=tour_embeddings
spring.ai.vectorstore.pgvector.dimensions=${AI_EMBEDDING_DIMENSIONS:768}
spring.ai.vectorstore.pgvector.initialize-schema=true
app.ai.rag.top-k=${RAG_TOP_K:8}
app.ai.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.0}
app.ai.rag.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:768}
app.ai.rag.system-prompt=\
  Bạn là trợ lý tư vấn tour trekking chuyên nghiệp, nhiệt tình và am hiểu của hệ thống.\
  \
  Hướng dẫn tư vấn và gợi ý tour:\
  1. Luôn trả lời bằng ngôn ngữ người dùng sử dụng (mặc định tiếng Việt nếu người dùng hỏi tiếng Việt).\
  2. CHỈ sử dụng thông tin CÓ TRONG phần Context bên dưới. Tuyệt đối không tự bịa đặt tour hoặc giá vé không có trong Context.\
  3. Khi tư vấn hoặc gợi ý tour, hãy trình bày chuyên nghiệp, hấp dẫn:\
     - Tên tour in đậm (kèm độ khó, thời gian nếu có)\
     - Giá tour rõ ràng (VND / người)\
     - Điểm nổi bật: địa điểm/cung đường, hoạt động trải nghiệm, yêu cầu thể lực\
     - Nếu có ảnh (trường Image / Ảnh trong Context), LUÔN hiển thị ảnh minh họa bằng cú pháp Markdown: ![Tên tour](URL_ảnh). CHỈ DÙNG CHÍNH XÁC URL ảnh có trong Context (bắt đầu bằng https://res.cloudinary.com/...), TUYỆT ĐỐI KHÔNG TỰ BỊA ĐẶT URL giả hoặc example.com.\
  4. Nếu người dùng hỏi gợi ý chung (ví dụ "gợi ý tour", "tư vấn tour"), hãy chọn lọc và so sánh 2-3 tour nổi bật nhất trong Context theo các mức độ khó hoặc địa điểm khác nhau để khách hàng dễ lựa chọn.\
  5. Đưa ra lời khuyên hữu ích cho người đi trekking (ví dụ: cần chuẩn bị giày, thể lực, đồ dùng cần mang theo như thông tin trong tour).\
  6. Nếu trong Context hoàn toàn không có thông tin phù hợp, hãy thông báo lịch sự rằng hiện chưa có tour phù hợp với yêu cầu cụ thể này và mời khách hỏi thêm.\
  7.Không trả lời những câu hỏi không liên quan đến doanh nghiệp, câu hỏi ngoài, tránh trả lời thêm hoặc bỏ qua và kêu người dùng hỏi lại câu khác liên quan đến tours và trekking hơn.

# New API-backed AI consultation module (kept separate from local RAG)
app.ai.local.enabled=${LOCAL_AI_ENABLED:false}
app.ai.integrate.enabled=${INTEGRATE_AI_ENABLED:true}
app.ai.integrate.gemini.api-key=${GEMINI_API_KEY:}
app.ai.integrate.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.integrate.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.integrate.gemini.temperature=${GEMINI_TEMPERATURE:0.15}
app.ai.integrate.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}
app.ai.integrate.gemini.timeout=${GEMINI_TIMEOUT:15s}
app.ai.integrate.session.ttl=${INTEGRATE_AI_SESSION_TTL:30m}
app.ai.integrate.session.max-turns=${INTEGRATE_AI_MAX_TURNS:6}
app.ai.integrate.limits.max-message-chars=${INTEGRATE_AI_MAX_MESSAGE_CHARS:2000}
app.ai.integrate.limits.requests-per-window=${INTEGRATE_AI_REQUESTS_PER_WINDOW:12}
app.ai.integrate.limits.rate-window=${INTEGRATE_AI_RATE_WINDOW:1m}
app.ai.integrate.catalog.max-tours=${INTEGRATE_AI_MAX_TOURS:40}
app.ai.integrate.catalog.max-schedules-per-tour=${INTEGRATE_AI_MAX_SCHEDULES_PER_TOUR:6}
app.ai.integrate.catalog.max-recommendations=${INTEGRATE_AI_MAX_RECOMMENDATIONS:3}
app.ai.integrate.budget.unusual-threshold-vnd=${INTEGRATE_AI_UNUSUAL_BUDGET_THRESHOLD_VND:1000000000}
app.ai.integrate.budget.max-digits=${INTEGRATE_AI_MAX_BUDGET_DIGITS:100}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=trekking
spring.flyway.default-schema=trekking
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:25}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Explicit public footer document mappings; only these documents allow anonymous reads.
app.public-policies.booking-guide-code=${PUBLIC_POLICY_BOOKING_GUIDE_CODE:BOOKING_GUIDE}
app.public-policies.refund-policy-code=${PUBLIC_POLICY_REFUND_POLICY_CODE:REFUND_POLICY}
app.public-policies.website-terms-code=${PUBLIC_POLICY_WEBSITE_TERMS_CODE:WEBSITE_TERMS}
app.public-policies.privacy-policy-code=${PUBLIC_POLICY_PRIVACY_POLICY_CODE:PRIVACY_POLICY}
app.public-policies.liability-waiver-code=${PUBLIC_POLICY_LIABILITY_WAIVER_CODE:LIABILITY_WAIVER}
