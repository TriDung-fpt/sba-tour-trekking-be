spring.application.name=treeking
server.port=${SERVER_PORT:8088}

# Database Configuration (Values injected from Environment Variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trekking_db}?currentSchema=trekking
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.default_schema=trekking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# Spring AI – LM Studio (Local AI for both Chat & Embeddings, 100% Free)
# =============================================================================
spring.ai.openai.base-url=${LM_STUDIO_BASE_URL:http://localhost:1234/v1}
spring.ai.openai.api-key=lm-studio

# Embedding (Local Nomic Embed in LM Studio)
spring.ai.openai.embedding.base-url=${LM_STUDIO_BASE_URL:http://localhost:1234/v1}
spring.ai.openai.embedding.api-key=lm-studio
spring.ai.openai.embedding.options.model=${LM_STUDIO_EMBEDDING_MODEL:text-embedding-nomic-embed-text-v1.5}

# Chat (Local LLM in LM Studio)
spring.ai.openai.chat.base-url=${LM_STUDIO_BASE_URL:http://localhost:1234/v1}
spring.ai.openai.chat.api-key=lm-studio
spring.ai.openai.chat.options.model=${LM_STUDIO_MODEL:prism-ml/bonsai-27b}
spring.ai.openai.chat.options.temperature=0.3

# =============================================================================
# Spring AI – pgvector (reuses the existing datasource; table auto-created)
# =============================================================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.schema-name=trekking
spring.ai.vectorstore.pgvector.table-name=tour_embeddings
spring.ai.vectorstore.pgvector.initialize-schema=true

# =============================================================================
# RAG tuning (app.rag.*)
# =============================================================================
# Number of chunks retrieved per query
app.rag.top-k=5
# Minimum cosine similarity score to include a chunk (0.0 – 1.0)
app.rag.similarity-threshold=0.3
# System prompt – {context} is replaced at runtime with retrieved chunks
app.rag.system-prompt=\
  You are a friendly and knowledgeable trekking tour assistant.\
  Use ONLY the following context to answer the user question.\
  If the answer is not contained in the context, say you don\u2019t know.\
  \n\nContext:\n{context}
