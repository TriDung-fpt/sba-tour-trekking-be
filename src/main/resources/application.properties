spring.application.name=treeking
server.port=${SERVER_PORT:8088}

# Database Configuration (Values injected from Environment Variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trekking_db}?currentSchema=trekking
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.default_schema=trekking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# Spring AI - OpenAI / LM Studio / Ngrok / Ollama compatible configuration
# =============================================================================
# Set AI_BASE_URL (or LM_STUDIO_BASE_URL) to your ngrok URL (e.g. https://xxxx.ngrok-free.app/v1)
# or local URL (e.g. http://localhost:1234/v1).
spring.ai.openai.base-url=${AI_BASE_URL:${LM_STUDIO_BASE_URL:http://localhost:1234/v1}}
spring.ai.openai.api-key=${AI_API_KEY:${LM_STUDIO_API_KEY:lm-studio}}

# Embedding configuration
spring.ai.openai.embedding.base-url=${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:${LM_STUDIO_BASE_URL:http://localhost:1234/v1}}}
spring.ai.openai.embedding.api-key=${AI_EMBEDDING_API_KEY:${AI_API_KEY:${LM_STUDIO_API_KEY:lm-studio}}}
spring.ai.openai.embedding.options.model=${AI_EMBEDDING_MODEL:${LM_STUDIO_EMBEDDING_MODEL:text-embedding-nomic-embed-text-v1.5}}

# Chat configuration
spring.ai.openai.chat.base-url=${AI_CHAT_BASE_URL:${AI_BASE_URL:${LM_STUDIO_BASE_URL:http://localhost:1234/v1}}}
spring.ai.openai.chat.api-key=${AI_CHAT_API_KEY:${AI_API_KEY:${LM_STUDIO_API_KEY:lm-studio}}}
spring.ai.openai.chat.options.model=${AI_CHAT_MODEL:${LM_STUDIO_MODEL:qwen2.5-7b-instruct-1m}}
spring.ai.openai.chat.options.temperature=${AI_CHAT_TEMPERATURE:0.3}

# =============================================================================
# Spring AI - pgvector (reuses the existing datasource; table auto-created)
# =============================================================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${AI_EMBEDDING_DIMENSIONS:768}
spring.ai.vectorstore.pgvector.schema-name=trekking
spring.ai.vectorstore.pgvector.table-name=tour_embeddings
spring.ai.vectorstore.pgvector.initialize-schema=true

# =============================================================================
# RAG tuning (app.rag.*)
# =============================================================================
app.rag.top-k=${RAG_TOP_K:5}
app.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.1}
app.rag.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:768}
app.rag.system-prompt=\
  Bạn là trợ lý tư vấn tour trekking chuyên nghiệp, thân thiện.\
  Quy tắc trả lời:\
  1. Luôn trả lời bằng chính ngôn ngữ mà người dùng hỏi (nếu người dùng hỏi tiếng Việt thì bắt buộc trả lời bằng tiếng Việt).\
  2. CHỈ sử dụng thông tin CÓ TRONG Context dưới đây để trả lời. Tuyệt đối không tự bịa đặt, suy diễn hoặc giới thiệu tour không có trong Context.\
  3. Nếu Context không có thông tin phù hợp, hãy thông báo lịch sự rằng hiện chưa có thông tin về tour này.\
  4. Khi trình bày tour, hãy định dạng rõ ràng: Tên tour in đậm, các thông tin giá, thời gian, độ khó, địa điểm trình bày bằng các gạch đầu dòng.\
  \n\nContext:\n{context}
