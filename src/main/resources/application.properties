spring.application.name=treeking
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Values injected from Environment Variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trekking_db}?currentSchema=trekking
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns versioned schema changes. Existing schema.sql databases are recorded at baseline V0.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=trekking
spring.flyway.schemas=trekking
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=baseline_schema_sql
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.default_schema=trekking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${EMAIL_SENDER:}}
spring.mail.password=${MAIL_PASSWORD:${EMAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.jwt-secret=${JWT_SECRET:}
app.auth.otp-secret=${OTP_SECRET:}
app.auth.issuer=trekking-api
app.auth.audience=trekking-client
app.auth.access-ttl=15m
app.auth.session-ttl=7d
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:}
app.auth.mail-from=${MAIL_FROM:${MAIL_USERNAME:${EMAIL_SENDER:}}}
app.auth.redis-prefix=${AUTH_REDIS_PREFIX:trekking:auth:}
app.partner.frontend-url=${FRONTEND_URL:http://localhost:5173}
springdoc.swagger-ui.csrf.enabled=true
